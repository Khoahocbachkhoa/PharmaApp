services:
  postgres-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pharmacy_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  spring-app:
    build: .
    command: java -jar app.jar
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db

volumes:
  pgdata: